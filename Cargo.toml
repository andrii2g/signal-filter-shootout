[package]
name = "signal-filter-shootout"
version = "0.1.0"
edition = "2024"
description = "Kalman vs. EWMA vs. median filtering shootout for synthetic sensors, CSV data, and WAV speech experiments"
license = "MIT"
repository = "https://github.com/OWNER/signal-filter-shootout"
readme = "README.md"
keywords = ["kalman", "ewma", "median-filter", "signal-processing", "iot"]
categories = ["command-line-utilities", "science"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
hound = "3.5"
rand = "0.9"
rand_distr = "0.5"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
approx = "0.5"
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
